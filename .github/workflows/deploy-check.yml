name: Post-deploy check

# Smoke-tests the live site after every push to main that Vercel actually
# deploys. Polls /api/cron/deploy-check until the new commit is serving,
# lets the endpoint verify its own internals (core tables, project resolution,
# GSC creds), then probes the outside surface: the dashboard login page and
# the MCP auth gate. Every failure is recorded on the backend, so the
# dashboard Home banner and the owner's failure email fire immediately -
# a broken deploy announces itself instead of waiting to be found in the
# morning as mystery cron errors.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-check
  cancel-in-progress: true # a newer push supersedes this check

# Checks out the repo to run the Vercel ignore-build script; every probe
# after that is plain curl, not the GitHub API.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # continue-on-error at JOB level: failures already land on the dashboard
    # rails (cron_runs -> Home banner + get_cron_health), so the RUN concluding
    # green here just stops GitHub from also emailing "Run failed".
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the pre-push tip to diff against

      # Vercel's Ignored Build Step skips pushes that cannot change what is
      # served (scripts/vercel-ignore-build.mjs). Those pushes produce NO
      # deployment, so polling for one burned 10 minutes and then painted a
      # red X on a commit that was fine - on the public repo, where a failed
      # check reads as a broken project. Ask the same script the same
      # question rather than keeping a second copy of the inert-path list
      # here: two lists drift, and the drift shows up as this same false
      # failure. Anything unclear (manual run, a branch's first push, a git
      # error) falls through to checking, matching the script's own bias.
      - name: Will this push even produce a deploy?
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable push base - running the checks."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if VERCEL_GIT_PREVIOUS_SHA="$BEFORE" node scripts/vercel-ignore-build.mjs; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Vercel skips this push, so there is no new deploy to smoke-test."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the deploy, then run backend self-checks
        if: steps.gate.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: ${{ vars.BACKEND_URL || 'https://dispatchseo.com' }}
          SHA: ${{ github.sha }}
        run: |
          # 40 tries x 15s = 10 minutes for Vercel to build + go live.
          # 404 counts as "not live yet": the currently-serving deploy may
          # predate the deploy-check route entirely.
          for i in $(seq 1 40); do
            code=$(curl -s -o body.json -w "%{http_code}" --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$URL/api/cron/deploy-check?expect=$SHA") || code=000
            case "$code" in
              200) echo "Backend self-checks passed:"; cat body.json; exit 0 ;;
              500) echo "Backend self-checks FAILED (banner + email already fired):"; cat body.json; exit 1 ;;
              202|404|000) echo "Waiting for $SHA to go live (HTTP $code, try $i/40)"; sleep 15 ;;
              *) echo "Unexpected HTTP $code:"; cat body.json || true; sleep 15 ;;
            esac
          done
          # "Never went live" has TWO causes with opposite fixes, and calling it
          # a failed build was wrong half the time: Vercel can also never START
          # a build, when the git-integration webhook is dropped - then nothing
          # failed, the commit simply does not exist as a deployment (seen
          # 2026-08-02 on 1c6b475, while the previous commit served fine). The
          # waiting body carries live_sha, so say what IS serving and name both
          # remedies instead of sending the reader to a build log that may not
          # exist.
          live=$(jq -r '.live_sha // empty' body.json 2>/dev/null || true)
          echo "Deploy for $SHA never went live within 10 minutes. Currently serving: ${live:-unknown}"
          msg="deploy for ${SHA:0:7} never went live within 10 minutes"
          [ -n "$live" ] && msg="$msg (still serving ${live:0:7})"
          msg="$msg - open the project's Deployments list: a FAILED deployment for this commit means read its build log; NO deployment for it at all means Vercel never picked the push up, and a redeploy (or any new commit) ships it"
          curl -sG --max-time 30 -H "Authorization: Bearer $CRON_SECRET" \
            --data-urlencode "fail=$msg" \
            "$URL/api/cron/deploy-check"
          exit 1

      - name: Probe the outside surface (dashboard + MCP gate)
        if: steps.gate.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SEO_MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
          URL: ${{ vars.BACKEND_URL || 'https://dispatchseo.com' }}
        run: |
          # On failure, report back so the dashboard banner + email fire.
          fail() {
            echo "$1"
            curl -sG --max-time 30 -H "Authorization: Bearer $CRON_SECRET" \
              --data-urlencode "fail=$1" "$URL/api/cron/deploy-check"
            exit 1
          }
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/login") || code=000
          [ "$code" = "200" ] || fail "dashboard /login returned HTTP $code (expected 200)"
          # Both directions of the token gate. Rejecting invalid callers is
          # only half the contract - the 2026-07-19 setup-wizard deploy broke
          # the other half (valid keys got 401), which took out auto-merge and
          # every agent workflow until the next push. project-mode is the
          # exact call seo-auto-merge makes, with the exact key it uses.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X POST -H "Content-Type: application/json" -d '{}' "$URL/api/mcp") || code=000
          [ "$code" = "401" ] || fail "MCP gate returned HTTP $code without a token (expected 401)"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $SEO_MCP_API_KEY" "$URL/api/project-mode") || code=000
          [ "$code" = "200" ] || fail "project-mode returned HTTP $code with a valid MCP key (expected 200) - token auth is broken, agent workflows will fail"
          echo "Surface checks passed: /login 200, tokenless MCP 401, valid-key project-mode 200."
