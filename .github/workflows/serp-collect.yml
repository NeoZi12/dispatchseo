name: SERP task collector

# Companion to the daily-ranks cron: daily-ranks POSTs cheap DataForSEO
# standard-queue SERP tasks (they finish in minutes), and this hourly ping has
# the backend fetch the results and write the rank rows. Hourly because rank
# freshness is user-visible; the endpoint exits in one indexed query when
# nothing is pending, so quiet hours cost seconds.

on:
  schedule:
    - cron: "37 * * * *" # hourly at :37 - offset off the top-of-the-hour rush
  workflow_dispatch:

concurrency:
  group: serp-collect
  cancel-in-progress: false

# Only curls the backend with a secret - no GitHub API, no checkout.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # continue-on-error at JOB level: the backend endpoint already logs any
    # failure to cron_runs (banner + get_cron_health), so the RUN concluding
    # green here just stops GitHub from also emailing "Run failed".
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Trigger the serp-collect cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            ${{ vars.BACKEND_URL || 'https://dispatchseo.com' }}/api/cron/serp-collect
