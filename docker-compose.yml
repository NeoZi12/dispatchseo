# DispatchSEO self-hosted stack: one command, four small containers, ~1GB RAM.
#
#   sh start.sh    # creates .env, picks a free port, docker compose up -d
#   then open the URL it prints - the setup wizard takes it from there
#
# Full guide: docs/SELF_HOSTING.md
#
# The project name is pinned so the stack has one identity no matter which
# folder the repo was cloned into - re-running the quickstart from a second
# clone updates the existing stack instead of spawning a broken duplicate.
name: dispatchseo
#
# Services:
#   postgres  - the database (data persists in the dispatch-pgdata volume)
#   migrate   - one-shot: applies supabase/migrations/setup.sql (idempotent,
#               safe on every boot - it's how upgrades pick up new tables)
#   postgrest - REST layer the app talks to (internal network only, no auth
#               needed because it is never exposed to the host)
#   app       - the Next.js dashboard + MCP server + cron endpoints
#   cron      - BusyBox crond that curls the app's cron endpoints on the same
#               schedules Vercel/GitHub Actions use for the cloud deployment
#   builder   - headless coding-agent executor: polls the app for due content
#               jobs (daily guide, weekly research, tool builds, geo-scan)
#               and runs them in-stack, so the pipeline works without any
#               public URL. Which agent runs a job comes from the PROJECT, so
#               one stack can host a Claude site and a Codex site at once.
#               Idles politely until at least one agent credential exists -
#               paste it on the dashboard's "Turn on automatic builds" step
#               (easiest), or set CLAUDE_CODE_OAUTH_TOKEN / OPENAI_API_KEY in
#               .env to override.

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch-local-only}
      POSTGRES_DB: dispatchseo
    volumes:
      - dispatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatchseo"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]

  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: dispatch
      PGPASSWORD: ${POSTGRES_PASSWORD:-dispatch-local-only}
      PGDATABASE: dispatchseo
    volumes:
      - ./supabase/migrations/setup.sql:/setup.sql:ro
    # After applying the schema, tell a running PostgREST to reload its schema
    # cache (it listens on the "pgrst" channel by default) - otherwise columns
    # added by an upgrade are invisible until that container restarts. On
    # first boot nobody is listening yet, which is harmless.
    command:
      - sh
      - -c
      - psql -v ON_ERROR_STOP=1 -f /setup.sql && psql -c "NOTIFY pgrst, 'reload schema'"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: always
    environment:
      PGRST_DB_URI: postgres://dispatch:${POSTGRES_PASSWORD:-dispatch-local-only}@postgres:5432/dispatchseo
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: dispatch
      PGRST_DB_POOL: "10"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [data]

  app:
    # Prebuilt image when pullable (public repo), local build otherwise -
    # start.sh picks. Forks with modified code: set BUILD_FROM_SOURCE=1 in
    # .env so your changes actually run instead of the upstream image.
    image: ghcr.io/neozi12/dispatchseo:latest
    build: .
    restart: always
    environment:
      POSTGREST_URL: http://postgrest:3000
      CRON_SECRET: "${CRON_SECRET:?set CRON_SECRET in .env (generate one with openssl rand -hex 24)}"
      APP_URL: ${APP_URL:-http://localhost:4005}
      # Optional overrides - the setup wizard handles all of these in the
      # dashboard; env vars only force a value (see .env.docker.example).
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      GSC_SERVICE_ACCOUNT_JSON: ${GSC_SERVICE_ACCOUNT_JSON:-}
      GSC_SITE_URL: ${GSC_SITE_URL:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      GH_MERGE_TOKEN: ${GH_MERGE_TOKEN:-}
      # The builder credentials (one per agent), on the APP as well as the
      # builder. /api/builder/jobs is what resolves a token per job and hands
      # it to the container, so the app is the process that has to be able to
      # see them. With them only on the builder, a stack configured the way
      # .env.docker.example documents came up advertising an agent it was
      # never handed work for: the container reported `?agents=codex`, the
      # feed resolved no codex credential and emitted no codex job, and
      # nothing anywhere said so. Silent stall, forever.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      SEED_KEYWORDS: ${SEED_KEYWORDS:-}
      # The anonymous once-a-day install ping (src/lib/heartbeat.ts). The id is
      # generated into .env by start.sh; setting DISPATCHSEO_TELEMETRY=off
      # there stops the ping. Both must be listed here or the app container
      # never sees them - this service enumerates its env explicitly.
      DISPATCH_INSTALL_ID: ${DISPATCH_INSTALL_ID:-}
      DISPATCHSEO_TELEMETRY: ${DISPATCHSEO_TELEMETRY:-}
      # Generated into .env by start.sh. SETUP_TOKEN gates the first-run
      # /setup page (start.sh prints it); POSTGRES_PASSWORD is the database
      # password the stack was created with.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch-local-only}
    ports:
      # Bind to LOOPBACK, not 0.0.0.0. A bare "4005:3000" publishes the
      # dashboard on every interface, and Docker writes its own DOCKER-chain
      # iptables rules that bypass ufw - so a VPS owner who dutifully ran
      # `ufw allow 22` still had the dashboard facing the internet. The VPS
      # guide states the opposite in as many words ("listening on port 4005 of
      # the server - but only locally"), and the two documented ways in are
      # unaffected by this: the `domain` profile's caddy reaches the app over
      # the compose network (--to app:3000), and the SSH tunnel in vps.mdx
      # (`ssh -L 4005:localhost:4005`) needs precisely a loopback bind.
      # DISPATCH_BIND is the escape hatch for anyone who really does want it
      # reachable on the LAN - set it to 0.0.0.0 deliberately, in front of a
      # firewall you control.
      - "${DISPATCH_BIND:-127.0.0.1}:${DISPATCH_PORT:-4005}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
    networks: [dispatch, data]

  cron:
    image: alpine:3.21
    restart: always
    environment:
      CRON_SECRET: "${CRON_SECRET:?set CRON_SECRET in .env (generate one with openssl rand -hex 24)}"
      APP_INTERNAL_URL: http://app:3000
    volumes:
      - ./docker/cron/crontab:/etc/crontabs/root:ro
      - ./docker/cron/hit.sh:/usr/local/bin/hit.sh:ro
      - ./docker/cron/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      app:
        condition: service_started
    networks: [dispatch]

  builder:
    image: ghcr.io/neozi12/dispatchseo-builder:latest
    build: ./docker/builder
    restart: always
    environment:
      CRON_SECRET: "${CRON_SECRET:?set CRON_SECRET in .env (generate one with openssl rand -hex 24)}"
      APP_INTERNAL_URL: http://app:3000
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # All optional, and all are checked: the builder runs whichever agent
      # each project asks for, so a stack needs a credential per agent it
      # actually hosts - not one blessed credential for the whole instance.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      # Which model Codex builds run on. Model availability is per-account
      # (gpt-5-codex 404s on a plain pay-as-you-go project key), so an account
      # that cannot serve the default needs this override - the same knob the
      # GitHub runner exposes as the SEO_CODEX_MODEL repo variable. run.sh has
      # always read it; without this line the .env value never reached the
      # container and the knob silently did nothing.
      CODEX_MODEL: ${CODEX_MODEL:-}
      # Cursor's twin of CODEX_MODEL - run.sh reads it; empty means Cursor's
      # own "auto" pick.
      CURSOR_MODEL: ${CURSOR_MODEL:-}
      BUILDER_GH_TOKEN: ${BUILDER_GH_TOKEN:-}
      BUILDER_POLL_SECONDS: ${BUILDER_POLL_SECONDS:-600}
    volumes:
      - dispatch-builder:/data
    depends_on:
      app:
        condition: service_started
    networks: [dispatch]

  # Bundled HTTPS proxy - only starts when start.sh sees DOMAIN in .env
  # (the "domain" profile). Caddy fetches and renews the certificate by
  # itself; certs persist in the dispatch-caddy volume. Hosts that already
  # run their own reverse proxy just leave DOMAIN unset.
  caddy:
    image: caddy:2-alpine
    restart: always
    profiles: [domain]
    command: caddy reverse-proxy --from "${DOMAIN:-}" --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - dispatch-caddy:/data
    depends_on:
      app:
        condition: service_started
    networks: [dispatch]

volumes:
  dispatch-pgdata:
  dispatch-builder:
  dispatch-caddy:

networks:
  dispatch:
  # The database tier. internal: true means no route off the box and nothing
  # outside this network can reach it: postgres, postgrest and migrate live
  # ONLY here, and the app is the one service on both networks. The builder
  # runs LLM-driven agents and the cron/caddy containers face the outside, so
  # none of them can reach the database or PostgREST directly - only the app.
  data:
    internal: true
